[project]
name = "gimp-mcp"
version = "0.2.0"
description = "Model Context Protocol server for safe, structured GIMP 3 automation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp[cli]>=2,<3",
]

[project.scripts]
gimp-mcp = "gimp_mcp.server:main"
gimp-mcp-gui = "gimp_mcp.gui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gimp_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
